name: Build KernelSU-Next

permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      android_version:
        type: string
        required: true
      kernel_version:
        type: string
        required: true
      sub_level:
        type: string
        required: true
      os_patch_level:
        type: string
        required: true
      add_susfs:
        type: boolean
        default: true
      add_zeromount:
        type: boolean
        default: true
      add_zram:
        type: boolean
        default: true
      add_bbg:
        type: boolean
        default: false
      add_overlayfs_support:
        type: boolean
        default: true
      add_kpm:
        type: boolean
        default: false
      add_ptrace_fix:
        type: boolean
        default: true
      add_perf_patches:
        type: boolean
        default: true
      sukisu_commit:
        type: string
        default: ""
      device_codename:
        type: string
        default: ""
      branch_namespace:
        type: string
        default: ""

jobs:
  build:
    name: "KernelSU-Next ${{ inputs.kernel_version }}.${{ inputs.sub_level }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KSU_VARIANT: KernelSU-Next
      KSU_DIR: KernelSU-Next

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Free Disk Space
      uses: endersonmenezes/free-disk-space@v3
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_packages_one_command: true
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
        rm_cmd: "rmz"
        rmz_version: "3.1.1"
        testing: false

    - name: Install LLD
      run: sudo apt-get install -y -qq lld binutils

    - name: Download AnyKernel3 Artifact
      uses: actions/download-artifact@v8
      with:
        name: anykernel3
        path: AnyKernel3

    - name: Download Git Repo Tool Artifact
      uses: actions/download-artifact@v8
      with:
        name: git-repo-tool
        path: git-repo

    - name: Download Kernel Patches Artifact
      uses: actions/download-artifact@v8
      with:
        name: kernel-patches
        path: kernel_patches

    - name: Download SukiSU Patch
      if: inputs.add_zram
      uses: actions/download-artifact@v8
      with:
        name: sukisu-patch
        path: SukiSU_patch

    - name: Setup Build Environment
      env:
        ANDROID_VER: ${{ inputs.android_version }}
        KERNEL_VER: ${{ inputs.kernel_version }}
        SUB_LEVEL: ${{ inputs.sub_level }}
        OS_PATCH: ${{ inputs.os_patch_level }}
      run: |
        CONFIG="${ANDROID_VER}-${KERNEL_VER}-${SUB_LEVEL}"
        KERNEL_ROOT="$GITHUB_WORKSPACE/$CONFIG"
        VERSION_DIR="${ANDROID_VER}-${KERNEL_VER}"
        mkdir -p "$KERNEL_ROOT"

        chmod +x "$GITHUB_WORKSPACE/git-repo/repo"
        echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"

        {
          echo "ANDROID_VER=$ANDROID_VER"
          echo "KERNEL_VER=$KERNEL_VER"
          echo "OS_PATCH=$OS_PATCH"
          echo "CONFIG=$CONFIG"
          echo "KERNEL_ROOT=$KERNEL_ROOT"
          echo "VERSION_DIR=$VERSION_DIR"
          echo "DEFCONFIG=$KERNEL_ROOT/common/arch/arm64/configs/gki_defconfig"
          echo "DEFCONFIG_FRAGMENT=$KERNEL_ROOT/common/arch/arm64/configs/sukisu_gki.fragment"
          echo "KERNEL_PATCHES=$GITHUB_WORKSPACE/kernel_patches"
          echo "ANYKERNEL3=$GITHUB_WORKSPACE/AnyKernel3"
        } >> "$GITHUB_ENV"

    - name: Sync Kernel Source
      working-directory: ${{ env.KERNEL_ROOT }}
      env:
        ANDROID_VER: ${{ inputs.android_version }}
        KERNEL_VER: ${{ inputs.kernel_version }}
        OS_PATCH: ${{ inputs.os_patch_level }}
      run: |
        FORMATTED_BRANCH="${ANDROID_VER}-${KERNEL_VER}-${OS_PATCH}"
        BRANCH_NAMESPACE="${{ inputs.branch_namespace }}"

        MANIFEST_BRANCH="common-${FORMATTED_BRANCH}"
        echo "Using GKI manifest branch: ${MANIFEST_BRANCH}"

        repo init -u https://android.googlesource.com/kernel/manifest \
          -b "${MANIFEST_BRANCH}" --depth=1

        # Only use branch_namespace to detect the source branch namespace.
        # The manifest repository itself uses 'common-...' naming and does not accept
        # 'common-deprecated/...'.
        REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common "*${FORMATTED_BRANCH}" || true)
        if [ -n "$REMOTE_BRANCH" ] && grep -q "deprecated/${FORMATTED_BRANCH}" <<< "$REMOTE_BRANCH"; then
          sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" .repo/manifests/default.xml
        fi

        repo --trace sync -c -j$(nproc --all) --fail-fast --no-tags --force-sync --no-clone-bundle

    - name: Extract Sublevel
      env:
        INPUT_SUB_LEVEL: ${{ inputs.sub_level }}
      run: |
        SUBLEVEL="$INPUT_SUB_LEVEL"
        if [[ -f "$KERNEL_ROOT/common/Makefile" ]]; then
          EXTRACTED=$(grep '^SUBLEVEL = ' "$KERNEL_ROOT/common/Makefile" | awk '{print $3}')
          [[ -n "$EXTRACTED" ]] && SUBLEVEL="$EXTRACTED"
        fi

        ARTIFACT_BASE="${KERNEL_VER}.${SUBLEVEL}-${ANDROID_VER}-${OS_PATCH}-KernelSU-Next"
        {
          echo "SUBLEVEL=$SUBLEVEL"
          echo "ARTIFACT_BASE=$ARTIFACT_BASE"
          echo "FILE_NAME=$ARTIFACT_BASE"
        } >> "$GITHUB_ENV"

    - name: Setup KernelSU-Next
      working-directory: ${{ env.KERNEL_ROOT }}
      env:
        SUKISU_COMMIT: ${{ inputs.sukisu_commit }}
      run: |
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" | bash -s dev
        [ -d "$KERNEL_ROOT/$KSU_DIR" ] || { echo "FATAL: $KSU_DIR not created by setup.sh"; exit 1; }

        PIN="${SUKISU_COMMIT:-$(cat "$GITHUB_WORKSPACE/$VERSION_DIR/kernelsu-next-pin.txt" 2>/dev/null || true)}"
        if [ -n "$PIN" ]; then
          cd "$KERNEL_ROOT/$KSU_DIR"
          git fetch origin
          git checkout "$PIN"
          echo "Pinned KernelSU-Next to $(git rev-parse --short=7 HEAD)"
        fi

        cd "$KERNEL_ROOT/common"

        SUPERCALLS="drivers/kernelsu/supercalls.c"
        if [ -f "$SUPERCALLS" ]; then
          if grep -q "vzalloc" "$SUPERCALLS" && ! head -5 "$SUPERCALLS" | grep -q "vmalloc.h"; then
            sed -i '1a #include <linux/vmalloc.h>' "$SUPERCALLS"
          fi
        fi

    - name: Fix Old Kernel Compatibility
      working-directory: ${{ env.KERNEL_ROOT }}/common
      run: |
        FIX_SCRIPT="$GITHUB_WORKSPACE/$VERSION_DIR/build-helpers/fix-old-kernel-compat.sh"
        [ -f "$FIX_SCRIPT" ] && bash "$FIX_SCRIPT" "$KERNEL_ROOT/common" "$SUBLEVEL" || true

    - name: Apply Upstream SUSFS Patch
      if: inputs.add_susfs
      working-directory: ${{ env.KERNEL_ROOT }}/common
      env:
        ADD_SUSFS: ${{ inputs.add_susfs }}
      run: |
        set -euo pipefail
        if [ "$ADD_SUSFS" != "true" ]; then
          echo "SUSFS disabled by workflow input"
          exit 0
        fi
        echo "Applying upstream SUSFS patch: $GITHUB_WORKSPACE/$VERSION_DIR/KernelSU-Next/patches/50_add_susfs_in_gki-${ANDROID_VER}-${KERNEL_VER}.patch"
        patch -p1 -F3 --no-backup-if-mismatch < "$GITHUB_WORKSPACE/$VERSION_DIR/KernelSU-Next/patches/50_add_susfs_in_gki-${ANDROID_VER}-${KERNEL_VER}.patch"

    - name: Validate Enhanced SUSFS Patch
      if: inputs.add_susfs
      working-directory: ${{ env.KERNEL_ROOT }}/common
      env:
        ADD_SUSFS: ${{ inputs.add_susfs }}
      run: |
        set -euo pipefail
        if [ "$ADD_SUSFS" != "true" ]; then
          echo "SUSFS disabled by workflow input"
          exit 0
        fi
        PATCH="$GITHUB_WORKSPACE/$VERSION_DIR/KernelSU-Next/patches/51_enhanced_susfs-${ANDROID_VER}-${KERNEL_VER}.patch"
        [ -s "$PATCH" ] || { echo "::error::Missing patch: $PATCH"; exit 1; }
        echo "Validating SUSFS patch: $PATCH"
        git apply --check --verbose --unsafe-paths "$PATCH" || {
          echo "::error::Malformed SUSFS patch: $PATCH"
          grep -n '^@@' "$PATCH" | tail -20 || true
          exit 1
        }

    - name: Apply Enhanced SUSFS Patch
      if: inputs.add_susfs
      working-directory: ${{ env.KERNEL_ROOT }}/common
      env:
        ADD_SUSFS: ${{ inputs.add_susfs }}
      run: |
        set -euo pipefail
        if [ "$ADD_SUSFS" != "true" ]; then
          echo "SUSFS disabled by workflow input"
          exit 0
        fi
        PATCH="$GITHUB_WORKSPACE/$VERSION_DIR/KernelSU-Next/patches/51_enhanced_susfs-${ANDROID_VER}-${KERNEL_VER}.patch"
        echo "Applying enhanced SUSFS patch: $PATCH"
        patch -p1 -F3 --no-backup-if-mismatch < "$PATCH"

    - name: Apply KSU Safety Patch
      if: inputs.add_susfs
      working-directory: ${{ env.KERNEL_ROOT }}/${{ env.KSU_DIR }}
      run: |
        PATCH="$GITHUB_WORKSPACE/$VERSION_DIR/KernelSU-Next/patches/70_ksu_safety-kernelsu-next-${KERNEL_VER}.patch"
        if [ -s "$PATCH" ]; then
          patch -p1 --no-backup-if-mismatch < "$PATCH"
        else
          echo "No 70_ patch needed"
        fi

        echo "=== KernelSU-Next Commit Exacto ==="
        cd "$KERNEL_ROOT/$KSU_DIR"
        git rev-parse HEAD

        echo "=== Inspección sucompat.c ==="
        sed -n '1,180p' kernel/feature/sucompat.c || true

        WILDFIX="$GITHUB_WORKSPACE/$VERSION_DIR/KernelSU-Next/patches/wildkernels"
        if [ -d "$WILDFIX" ]; then
          echo "Aplicando parches WildKernels estricto..."
          for P in \
            fix_Makefile.patch \
            fix_ksu.c.patch \
            fix_ksud.c.patch \
            fix_supercalls.c.patch \
            fix_sucompat.c.patch \
            fix_kernel_umount.c.patch \
            fix_rules.c.patch; do
            if [ -f "$WILDFIX/$P" ]; then
              echo "  → Aplicando $P"
              patch -p1 --no-backup-if-mismatch < "$WILDFIX/$P"
            fi
          done
        fi

    - name: Apply ZeroMount Patch
      if: inputs.add_zeromount && inputs.add_susfs
      working-directory: ${{ env.KERNEL_ROOT }}/common
      run: |
        patch -p1 -F3 --no-backup-if-mismatch < "$GITHUB_WORKSPACE/$VERSION_DIR/KernelSU-Next/patches/60_zeromount-${ANDROID_VER}-${KERNEL_VER}.patch"